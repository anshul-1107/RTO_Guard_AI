[project]
name = "rto-guard"
version = "0.1.0"
description = "AI-powered RTO reduction agent for D2C ecommerce"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "mlflow>=2.12",
    "google-genai>=1.20",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "langfuse>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "pre-commit>=3.6", "streamlit>=1.40"]

[tool.setuptools]
packages = ["agent", "api", "dashboard", "data", "db", "evals", "ml", "rag", "rto_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
