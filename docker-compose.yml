services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rto_guard_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rto_pass}
      POSTGRES_DB: ${POSTGRES_DB:-rto_guard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rto} -d ${POSTGRES_DB:-rto_guard}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
